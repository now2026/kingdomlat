<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kingdom.lat · realms of stone & spirit</title>
  <style>
    :root {
      --bg: #0A192F;
      --text: #FFFAFA;
      --border: #1E3A5F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      padding: 2rem 1rem;
      text-align: center;
    }
    .greeting {
      font-size: 0.9rem;
      opacity: 0.85;
      margin: 1rem 0 2rem;
      letter-spacing: 0.5px;
    }
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto 3rem;
    }
    .portal-card {
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .portal-card:hover, .portal-card:focus {
      transform: scale(1.02);
      background: rgba(255,255,255,0.05);
      outline: none;
    }
    #dynamic-section {
      max-width: 800px;
      margin: 0 auto 2rem;
      padding: 1rem;
      border-top: 1px solid var(--border);
    }
    .json-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }
    .json-item { margin: 0.75rem 0; text-align: left; max-width: 400px; margin-inline: auto; }
    .json-link {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px dotted var(--border);
      padding-bottom: 2px;
      font-weight: 500;
    }
    .json-link:hover, .json-link:focus {
      text-decoration: underline;
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }
    .json-note-de {
      display: block;
      font-size: 0.75rem;
      opacity: 0.6;
      margin-top: 0.2rem;
      font-style: italic;
    }
    .error-msg { opacity: 0.5; font-size: 0.8rem; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>$ kingdom.lat</h1>
    <p class="subtitle">realms without borders · nature, myth & silence</p>
    <div class="greeting" id="greetings"></div>
    
    <div class="portal-grid">
      <a href="kingdom-of-gems.html" class="portal-card">💎 kingdom of gems</a>
      <a href="/up/up.html" class="portal-card" target="_blank" rel="noopener noreferrer">⚡ up tool · extract text locally</a>
    </div>

    <section id="dynamic-section" aria-live="polite">
      <h2 class="json-title">Trusted Resources</h2>
      <div id="json-content">Loading resources...</div>
    </section>
  </main>

  <script>
    // Multi-region welcome greetings
    const greetings = "Välkommen · Laipni lūdzam · Dobrodošli · Witamy · Fáilte · Welkom · Καλώς ήρθατε";
    document.getElementById('greetings').textContent = greetings;

    // Fetch & render JSON resources
    async function loadResources() {
      const container = document.getElementById('json-content');
      try {
        const res = await fetch('/data.json');
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();
        
        let html = '';
        if (data.description_de) {
          html += `<p style="font-size:0.8rem;opacity:0.7;margin-bottom:0.5rem">${data.description_de}</p>`;
        }
        if (data.items) {
          data.items.forEach(item => {
            html += `<div class="json-item">
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="json-link">${item.text} ↗</a>
              ${item.note_de ? `<span class="json-note-de">${item.note_de}</span>` : ''}
            </div>`;
          });
        }
        if (data.footer_note_de) {
          html += `<p style="font-size:0.7rem;opacity:0.5;margin-top:1rem">${data.footer_note_de}</p>`;
        }
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<p class="error-msg">Resources temporarily unavailable.</p>';
      }
    }
    document.addEventListener('DOMContentLoaded', loadResources);
  </script>
</body>
</html>
