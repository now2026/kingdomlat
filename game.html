<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Din Viden - Threema Ordliste</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6d4aff 0%, #a855f7 50%, #f0abfc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #6d4aff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6d4aff, #a855f7);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #6d4aff;
        }

        .question-card {
            background: linear-gradient(135deg, #f3f0ff 0%, #faf5ff 100%);
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
            border: 2px solid #6d4aff;
            animation: cardAppear 0.5s ease;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .danish-word {
            font-size: 2rem;
            color: #6d4aff;
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(109, 74, 255, 0.15);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .option-btn {
            background: white;
            border: 2px solid #6d4aff;
            color: #6d4aff;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .option-btn:hover {
            background: #6d4aff;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(109, 74, 255, 0.3);
        }

        .option-btn.selected {
            background: #6d4aff;
            color: white;
            border-color: #6d4aff;
        }

        .feedback {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            animation: feedbackPop 0.5s ease;
            text-align: center;
        }

        @keyframes feedbackPop {
            0% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .feedback.success {
            background: linear-gradient(135deg, #d1fae5 0%, #fef3c7 100%);
            color: #059669;
            border: 2px solid #059669;
        }

        .feedback h3 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .translation-showcase {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .emoji-rain {
            position: fixed;
            font-size: 2rem;
            animation: rain 1s linear infinite;
            z-index: 1000;
        }

        @keyframes rain {
            from { top: -50px; opacity: 1; }
            to { bottom: 100vh; opacity: 0; }
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #6d4aff, #a855f7);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(109, 74, 255, 0.4);
        }

        .nav-btn.hidden {
            display: none;
        }

        .final-screen {
            text-align: center;
            padding: 40px;
        }

        .final-score {
            font-size: 4rem;
            color: #6d4aff;
            margin: 20px 0;
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #6d4aff;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(720deg); }
        }

        /* Flag emojis for languages */
        .flag {
            font-size: 1.5rem;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏔️ Test Din Viden 🏔️</h1>
        <p class="subtitle">Udforsk Threema's 50 essentielle ord på 7 sprog</p>

        <!-- Progress -->
        <div class="stats">
            <span id="question-counter">Spørgsmål: 1 / 50</span>
            <span id="score-display">Score: 0</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress" style="width: 2%"></div>
        </div>

        <!-- Game Area -->
        <div id="game-area">
            <div class="question-card">
                <p style="text-align: center; color: #666;">Hvad betyder:</p>
                <div class="danish-word" id="word-question">...</div>
                <p style="text-align: center; color: #666; margin-bottom: 15px;">Vælg den rigtige oversættelse:</p>
                
                <div class="options-grid" id="options-container">
                    <!-- Options will be generated here -->
                </div>
            </div>

            <div class="feedback success" id="feedback">
                <h3 id="encouragement">🎉 Fantastisk! 🎁</h3>
                <div class="translation-showcase" id="translations"></div>
            </div>

            <div class="navigation">
                <button class="nav-btn hidden" id="next-btn">Næste ➡️</button>
            </div>
        </div>

        <!-- Final Screen -->
        <div id="final-screen" class="final-screen hidden">
            <h2>🏆 Hjerteligt Tillykke! 🏆</h2>
            <p>Du har gennemført Threema Ordlisten!</p>
            <div class="final-score" id="final-score">50/50</div>
            <p style="font-size: 1.2rem; color: #666; margin: 20px 0;">
                Din viden om digitalt privatliv er uvurderlig!
            </p>
            <div style="margin: 30px 0; font-size: 3rem;">
                🏔️ 🔐 🎉 🌿 💎 🤍
            </div>
            <button class="nav-btn" onclick="location.reload()">🔄 Spil igen</button>
        </div>
    </div>

    <script>
        // The 50 essential words with translations
        const words = [
            { da: "Privatliv", fr: "Vie privée", es: "Privacidad", no: "Personvern", it: "Privacy", de: "Privatsphäre", hu: "Adatvédelem" },
            { da: "Sikkerhed", fr: "Sécurité", es: "Seguridad", no: "Sikkerhet", it: "Sicurezza", de: "Sicherheit", hu: "Biztonság" },
            { da: "Kryptering", fr: "Chiffrement", es: "Cifrado", no: "Kryptering", it: "Crittografia", de: "Verschlüsselung", hu: "Titkosítás" },
            { da: "Anonymitet", fr: "Anonymat", es: "Anonimato", no: "Anonymitet", it: "Anonimato", de: "Anonymität", hu: "Anonimitás" },
            { da: "Besked", fr: "Message", es: "Mensaje", no: "Melding", it: "Messaggio", de: "Nachricht", hu: "Üzenet" },
            { da: "Opkald", fr: "Appel", es: "Llamada", no: "Anrop", it: "Chiamata", de: "Anruf", hu: "Hívás" },
            { da: "Fil", fr: "Fichier", es: "Archivo", no: "Fil", it: "File", de: "Datei", hu: "Fájl" },
            { da: "Kontakt", fr: "Contact", es: "Contacto", no: "Kontakt", it: "Contatto", de: "Kontakt", hu: "Kapcsolat" },
            { da: "Gruppe", fr: "Groupe", es: "Grupo", no: "Gruppe", it: "Gruppo", de: "Gruppe", hu: "Csoport" },
            { da: "Profil", fr: "Profil", es: "Perfil", no: "Profil", it: "Profilo", de: "Profil", hu: "Profil" },
            { da: "Indstilling", fr: "Paramètre", es: "Configuración", no: "Innstilling", it: "Impostazione", de: "Einstellung", hu: "Beállítás" },
            { da: "Beskyttelse", fr: "Protection", es: "Protección", no: "Beskyttelse", it: "Protezione", de: "Schutz", hu: "Védelem" },
            { da: "Fortrolighed", fr: "Confidentialité", es: "Confidencialidad", no: "Konfidensialitet", it: "Riservatezza", de: "Vertraulichkeit", hu: "Bizalmasság" },
            { da: "Data", fr: "Données", es: "Datos", no: "Data", it: "Dati", de: "Daten", hu: "Adatok" },
            { da: "Server", fr: "Serveur", es: "Servidor", no: "Tjener", it: "Server", de: "Server", hu: "Szerver" },
            { da: "Kode", fr: "Code", es: "Código", no: "Kode", it: "Codice", de: "Code", hu: "Kód" },
            { da: "Nøgle", fr: "Clé", es: "Clave", no: "Nøkkel", it: "Chiave", de: "Schlüssel", hu: "Kulcs" },
            { da: "Adgang", fr: "Accès", es: "Acceso", no: "Tilgang", it: "Accesso", de: "Zugang", hu: "Hozzáférés" },
            { da: "Bruger", fr: "Utilisateur", es: "Usuario", no: "Bruker", it: "Utente", de: "Benutzer", hu: "Felhasználó" },
            { da: "Identitet", fr: "Identité", es: "Identidad", no: "Identitet", it: "Identità", de: "Identität", hu: "Identitás" },
            { da: "Verifikation", fr: "Vérification", es: "Verificación", no: "Verifisering", it: "Verifica", de: "Verifizierung", hu: "Ellenőrzés" },
            { da: "Sikker", fr: "Sûr", es: "Seguro", no: "Sikker", it: "Sicuro", de: "Sicher", hu: "Biztonságos" },
            { da: "Privat", fr: "Privé", es: "Privado", no: "Privat", it: "Privato", de: "Privat", hu: "Privát" },
            { da: "Digital", fr: "Numérique", es: "Digital", no: "Digital", it: "Digitale", de: "Digital", hu: "Digitális" },
            { da: "Kommunikation", fr: "Communication", es: "Comunicación", no: "Kommunikasjon", it: "Comunicazione", de: "Kommunikation", hu: "Kommunikáció" },
            { da: "Netværk", fr: "Réseau", es: "Red", no: "Nettverk", it: "Rete", de: "Netzwerk", hu: "Hálózat" },
            { da: "Internet", fr: "Internet", es: "Internet", no: "Internett", it: "Internet", de: "Internet", hu: "Internet" },
            { da: "Applikation", fr: "Application", es: "Aplicación", no: "Applikasjon", it: "Applicazione", de: "Anwendung", hu: "Alkalmazás" },
            { da: "Tjeneste", fr: "Service", es: "Servicio", no: "Tjeneste", it: "Servizio", de: "Dienst", hu: "Szolgáltatás" },
            { da: "Platform", fr: "Plateforme", es: "Plataforma", no: "Plattform", it: "Piattaforma", de: "Plattform", hu: "Platform" },
            { da: "Schweiz", fr: "Suisse", es: "Suiza", no: "Sveits", it: "Svizzera", de: "Schweiz", hu: "Svájc" },
            { da: "Lovgivning", fr: "Législation", es: "Legislación", no: "Lovgivning", it: "Legislazione", de: "Gesetzgebung", hu: "Jogszabály" },
            { da: "Overholdelse", fr: "Conformité", es: "Cumplimiento", no: "Overholdelse", it: "Conformità", de: "Einhaltung", hu: "Megfelelés" },
            { da: "Transparens", fr: "Transparence", es: "Transparencia", no: "Transparens", it: "Trasparenza", de: "Transparenz", hu: "Átláthatóság" },
            { da: "Åben kilde", fr: "Open Source", es: "Código abierto", no: "Åpen kilde", it: "Open Source", de: "Open Source", hu: "Nyílt forráskód" },
            { da: "Revision", fr: "Audit", es: "Auditoría", no: "Revisjon", it: "Revisione", de: "Prüfung", hu: "Ellenőrzés" },
            { da: "Sårbarhed", fr: "Vulnérabilité", es: "Vulnerabilidad", no: "Sårbarhet", it: "Vulnerabilità", de: "Schwachstelle", hu: "Sebezhetőség" },
            { da: "Opdatering", fr: "Mise à jour", es: "Actualización", no: "Oppdatering", it: "Aggiornamento", de: "Update", hu: "Frissítés" },
            { da: "Backup", fr: "Sauvegarde", es: "Copia de seguridad", no: "Sikkerhetskopi", it: "Backup", de: "Backup", hu: "Biztonsági mentés" },
            { da: "Gendannelse", fr: "Restauration", es: "Restauración", no: "Gjenoppretting", it: "Ripristino", de: "Wiederherstellung", hu: "Helyreállítás" },
            { da: "Synkronisering", fr: "Synchronisation", es: "Sincronización", no: "Synkronisering", it: "Sincronizzazione", de: "Synchronisation", hu: "Szinkronizálás" },
            { da: "Deling", fr: "Partage", es: "Compartir", no: "Deling", it: "Condivisione", de: "Teilen", hu: "Megosztás" },
            { da: "Lokalitet", fr: "Localisation", es: "Ubicación", no: "Posisjon", it: "Posizione", de: "Standort", hu: "Hely" },
            { da: "Kvalitet", fr: "Qualité", es: "Calidad", no: "Kvalitet", it: "Qualità", de: "Qualität", hu: "Minőség" },
            { da: "Pålidelighed", fr: "Fiabilité", es: "Fiabilidad", no: "Pålitelighet", it: "Affidabilità", de: "Zuverlässigkeit", hu: "Megbízhatóság" },
            { da: "Hastighed", fr: "Vitesse", es: "Velocidad", no: "Hastighet", it: "Velocità", de: "Geschwindigkeit", hu: "Sebesség" },
            { da: "Effektivitet", fr: "Efficacité", es: "Eficiencia", no: "Effektivitet", it: "Efficienza", de: "Effizienz", hu: "Hatékonyság" },
            { da: "Frihed", fr: "Liberté", es: "Libertad", no: "Frihet", it: "Libertà", de: "Freiheit", hu: "Szabadság" },
            { da: "Rettighed", fr: "Droit", es: "Derecho", no: "Rettighet", it: "Diritto", de: "Recht", hu: "Jog" },
            { da: "Respekt", fr: "Respect", es: "Respeto", no: "Respekt", it: "Rispetto", de: "Respekt", hu: "Tisztelet" }
        ];

        const encouragementMessages = [
            "🎉 Fantastisk! 🎁",
            "🏔️ Perfekt! Du er på vej! 🏔️",
            "🔐 Vidunderligt! Privatlivs-ekspert! 🔐",
            "💎 Fremragende! Så flot! 💎",
            "🌿 Smukt! Du lærer hurtigt! 🌿",
            "✨ Enestående! Fortsat god arbejdsindsats! ✨",
            "🎊 Super! Dette er imponerende! 🎊",
            "🤍 Dejligt! Du er fantastisk! 🤍",
            "🏅 Mægtigt! Så klokt! 🏅",
            "🌟 Brillant! Du gør det fantastisk! 🌟"
        ];

        let currentIndex = 0;
        let score = 0;
        let shuffledWords = [];
        let selectedLanguage = null;

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function initGame() {
            shuffledWords = shuffle(words);
            loadQuestion();
        }

        function loadQuestion() {
            const word = shuffledWords[currentIndex];
            document.getElementById('word-question').textContent = word.da;
            document.getElementById('question-counter').textContent = `Spørgsmål: ${currentIndex + 1} / ${words.length}`;
            
            // Update progress bar
            const progress = ((currentIndex + 1) / words.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;

            // Generate language options
            const languages = [
                { flag: '🇫🇷', code: 'fr', name: 'Fransk' },
                { flag: '🇪🇸', code: 'es', name: 'Spansk' },
                { flag: '🇳🇴', code: 'no', name: 'Norsk' },
                { flag: '🇮🇹', code: 'it', name: 'Italiensk' },
                { flag: '🇩🇪', code: 'de', name: 'Tysk' },
                { flag: '🇭🇺', code: 'hu', name: 'Ungarsk' }
            ];

            const shuffledLanguages = shuffle(languages);
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            shuffledLanguages.forEach(lang => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = `${lang.flag} ${word[lang.code]}`;
                button.onclick = () => selectAnswer(lang);
                optionsContainer.appendChild(button);
            });

            // Hide feedback
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectAnswer(language) {
            const word = shuffledWords[currentIndex];
            selectedLanguage = language;

            // Select the button visually
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            // Show feedback
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';

            // Random encouragement message
            const randomEncouragement = encouragementMessages[Math.floor(Math.random() * encouragementMessages.length)];
            document.getElementById('encouragement').textContent = randomEncouragement;

            // Show all translations
            const translationsDiv = document.getElementById('translations');
            translationsDiv.innerHTML = `
                <strong>Dansk:</strong> ${word.da}<br>
                <span class="flag">${language.flag}</span> <strong>${language.name}:</strong> ${word[language.code]}<br><br>
                <em>Français:</em> ${word.fr} • <em>Español:</em> ${word.es}<br>
                <em>Norsk:</em> ${word.no} • <em>Italiano:</em> ${word.it}<br>
                <em>Deutsch:</em> ${word.de} • <em>Magyar:</em> ${word.hu}
            `;

            // Update score
            score++;
            document.getElementById('score-display').textContent = `Score: ${score}`;

            // Show next button or finish
            const nextBtn = document.getElementById('next-btn');
            if (currentIndex < words.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                nextBtn.textContent = 'Afslut 🏁';
                nextBtn.classList.remove('hidden');
                nextBtn.onclick = showFinalScreen;
            }

            // Trigger emoji rain briefly
            createEmojiRain();
        }

        function createEmojiRain() {
            const emojis = ['🎉', '🎁', '⭐', '🏔️', '🔐', '💎', '🌟'];
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.className = 'emoji-rain';
                    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    emoji.style.left = `${Math.random() * 100}vw`;
                    emoji.style.animationDuration = `${1 + Math.random()}s`;
                    document.body.appendChild(emoji);
                    setTimeout(() => emoji.remove(), 2000);
                }, i * 100);
            }
        }

        function showFinalScreen() {
            document.getElementById('game-area').style.display = 'none';
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');
            finalScreen.style.display = 'block';
            document.getElementById('final-score').textContent = `${score}/${words.length}`;

            // Create confetti effect
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#6d4aff', '#a855f7', '#f0abfc', '#d1fae5', '#fef3c7'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = `${Math.random() * 100}vw`;
                    confetti.style.animationDelay = `${Math.random() * 3}s`;
                    document.body.appendChild(confetti);
                }, i * 50);
            }
        }

        // Next button functionality
        document.getElementById('next-btn').addEventListener('click', () => {
            currentIndex++;
            loadQuestion();
        });

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
